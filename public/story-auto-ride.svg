<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Indiranagar to Majestic auto ride story scene</title>
  <desc id="desc">A yellow and green auto rickshaw on a Bangalore road with direction signs for Indiranagar and Majestic.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.58" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#374151"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <path d="M0 248 H640 V360 H0 Z" fill="url(#road)"/>
  <path d="M64 304 H576" stroke="#fef08a" stroke-width="9" stroke-linecap="round" stroke-dasharray="46 30"/>
  <g transform="translate(78 88)">
    <rect x="0" y="0" width="214" height="38" rx="10" fill="#0f766e"/>
    <rect x="26" y="38" width="12" height="120" rx="6" fill="#0f172a"/>
    <text x="107" y="25" text-anchor="middle" fill="#f7f7fb" font-family="Arial, sans-serif" font-size="18" font-weight="800">INDIRANAGAR</text>
  </g>
  <g transform="translate(378 104)">
    <rect x="0" y="0" width="184" height="38" rx="10" fill="#7c3aed"/>
    <rect x="146" y="38" width="12" height="104" rx="6" fill="#0f172a"/>
    <text x="92" y="25" text-anchor="middle" fill="#f7f7fb" font-family="Arial, sans-serif" font-size="18" font-weight="800">MAJESTIC</text>
  </g>
  <g transform="translate(170 154)">
    <path d="M42 90 L78 26 H276 L326 90 Z" fill="#facc15"/>
    <path d="M96 42 H248 L274 82 H74 Z" fill="#111820"/>
    <rect x="28" y="88" width="318" height="86" rx="30" fill="#16a34a"/>
    <rect x="74" y="106" width="92" height="38" rx="10" fill="#d7f5e2"/>
    <rect x="190" y="106" width="74" height="38" rx="10" fill="#d7f5e2"/>
    <rect x="270" y="112" width="38" height="28" rx="8" fill="#facc15"/>
    <circle cx="92" cy="178" r="26" fill="#111820"/>
    <circle cx="282" cy="178" r="26" fill="#111820"/>
    <circle cx="92" cy="178" r="11" fill="#d1d5db"/>
